<svg viewBox="0 0 680 300" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Example 1.9: จำนวน shock ที่ Xₜ กับ X(t+h) ใช้ร่วมกันที่ h = 1, 2, 3" font-family="-apple-system, Helvetica Neue, Arial, Noto Sans Thai, sans-serif"><defs><marker id="ao" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#c25e00"/></marker><marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1d6fb8"/></marker><marker id="ak" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1a1a1a"/></marker><marker id="as" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#6b6b66"/></marker></defs><text x="128.0" y="22.0" font-size="11" fill="#6b6b66" text-anchor="middle" font-weight="normal">w(t-1)</text><text x="184.0" y="22.0" font-size="11" fill="#6b6b66" text-anchor="middle" font-weight="normal">w(t)</text><text x="240.0" y="22.0" font-size="11" fill="#6b6b66" text-anchor="middle" font-weight="normal">w(t+1)</text><text x="296.0" y="22.0" font-size="11" fill="#6b6b66" text-anchor="middle" font-weight="normal">w(t+2)</text><text x="352.0" y="22.0" font-size="11" fill="#6b6b66" text-anchor="middle" font-weight="normal">w(t+3)</text><text x="408.0" y="22.0" font-size="11" fill="#6b6b66" text-anchor="middle" font-weight="normal">w(t+4)</text><text x="464.0" y="22.0" font-size="11" fill="#6b6b66" text-anchor="middle" font-weight="normal">w(t+5)</text><text x="88.0" y="64.0" font-size="12.5" fill="#1a1a1a" text-anchor="end" font-weight="bold">Xₜ</text><circle cx="128" cy="60" r="17" fill="#fff" stroke="#1d6fb8" stroke-width="2"/><text x="128.0" y="65.0" font-size="13" fill="#c25e00" text-anchor="middle" font-weight="bold">⅓</text><circle cx="184" cy="60" r="17" fill="#fff" stroke="#1d6fb8" stroke-width="2"/><text x="184.0" y="65.0" font-size="13" fill="#c25e00" text-anchor="middle" font-weight="bold">⅓</text><circle cx="240" cy="60" r="17" fill="#fff" stroke="#1d6fb8" stroke-width="2"/><text x="240.0" y="65.0" font-size="13" fill="#c25e00" text-anchor="middle" font-weight="bold">⅓</text><text x="88.0" y="122.0" font-size="12.5" fill="#1a1a1a" text-anchor="end" font-weight="bold">X(t+1)</text><circle cx="184" cy="118" r="17" fill="#fff1a8" stroke="#1d6fb8" stroke-width="2"/><text x="184.0" y="123.0" font-size="13" fill="#c25e00" text-anchor="middle" font-weight="bold">⅓</text><circle cx="240" cy="118" r="17" fill="#fff1a8" stroke="#1d6fb8" stroke-width="2"/><text x="240.0" y="123.0" font-size="13" fill="#c25e00" text-anchor="middle" font-weight="bold">⅓</text><circle cx="296" cy="118" r="17" fill="#fff" stroke="#1d6fb8" stroke-width="2"/><text x="296.0" y="123.0" font-size="13" fill="#c25e00" text-anchor="middle" font-weight="bold">⅓</text><text x="503.2" y="123.0" font-size="12" fill="#1a1a1a" text-anchor="start" font-weight="normal">2 ลูกร่วม → ρ(1) = 2/3</text><text x="88.0" y="180.0" font-size="12.5" fill="#1a1a1a" text-anchor="end" font-weight="bold">X(t+2)</text><circle cx="240" cy="176" r="17" fill="#fff1a8" stroke="#1d6fb8" stroke-width="2"/><text x="240.0" y="181.0" font-size="13" fill="#c25e00" text-anchor="middle" font-weight="bold">⅓</text><circle cx="296" cy="176" r="17" fill="#fff" stroke="#1d6fb8" stroke-width="2"/><text x="296.0" y="181.0" font-size="13" fill="#c25e00" text-anchor="middle" font-weight="bold">⅓</text><circle cx="352" cy="176" r="17" fill="#fff" stroke="#1d6fb8" stroke-width="2"/><text x="352.0" y="181.0" font-size="13" fill="#c25e00" text-anchor="middle" font-weight="bold">⅓</text><text x="503.2" y="181.0" font-size="12" fill="#1a1a1a" text-anchor="start" font-weight="normal">1 ลูกร่วม → ρ(2) = 1/3</text><text x="88.0" y="238.0" font-size="12.5" fill="#1a1a1a" text-anchor="end" font-weight="bold">X(t+3)</text><circle cx="296" cy="234" r="17" fill="#fff" stroke="#1d6fb8" stroke-width="2"/><text x="296.0" y="239.0" font-size="13" fill="#c25e00" text-anchor="middle" font-weight="bold">⅓</text><circle cx="352" cy="234" r="17" fill="#fff" stroke="#1d6fb8" stroke-width="2"/><text x="352.0" y="239.0" font-size="13" fill="#c25e00" text-anchor="middle" font-weight="bold">⅓</text><circle cx="408" cy="234" r="17" fill="#fff" stroke="#1d6fb8" stroke-width="2"/><text x="408.0" y="239.0" font-size="13" fill="#c25e00" text-anchor="middle" font-weight="bold">⅓</text><text x="503.2" y="239.0" font-size="12" fill="#1a1a1a" text-anchor="start" font-weight="normal">ไม่มีลูกร่วม → ρ(3) = 0</text><text x="340.0" y="285.0" font-size="11.5" fill="#6b6b66" text-anchor="middle" font-weight="normal">ช่องเหลือง = ลูกบอล (shock) ที่อยู่ทั้งในถุง Xₜ และถุงที่ห่าง h · แต่ละคู่ให้ ⅓·⅓·σ² แล้วหารด้วย γ(0) = 3/9 σ²</text></svg>
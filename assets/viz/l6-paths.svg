<svg viewBox="0 0 600 270" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="ความนิ่งของ AR(1) เชิงภาพ" font-family="-apple-system, Helvetica Neue, Arial, Noto Sans Thai, sans-serif"><line x1="60" x2="560" y1="220.0" y2="220.0" stroke="#eee"/><text x="52.0" y="224.0" font-size="11.5" fill="#6b6b66" text-anchor="end" font-weight="normal">0</text><line x1="60" x2="560" y1="160.625" y2="160.625" stroke="#eee"/><text x="52.0" y="164.6" font-size="11.5" fill="#6b6b66" text-anchor="end" font-weight="normal">1</text><line x1="60" x2="560" y1="101.25" y2="101.25" stroke="#eee"/><text x="52.0" y="105.2" font-size="11.5" fill="#6b6b66" text-anchor="end" font-weight="normal">2</text><line x1="60" x2="560" y1="41.875" y2="41.875" stroke="#eee"/><text x="52.0" y="45.9" font-size="11.5" fill="#6b6b66" text-anchor="end" font-weight="normal">3</text><text x="60.0" y="238.0" font-size="11" fill="#6b6b66" text-anchor="middle" font-weight="normal">t = 0</text><text x="143.3" y="238.0" font-size="11" fill="#6b6b66" text-anchor="middle" font-weight="normal">t = 1</text><text x="226.7" y="238.0" font-size="11" fill="#6b6b66" text-anchor="middle" font-weight="normal">t = 2</text><text x="310.0" y="238.0" font-size="11" fill="#6b6b66" text-anchor="middle" font-weight="normal">t = 3</text><text x="393.3" y="238.0" font-size="11" fill="#6b6b66" text-anchor="middle" font-weight="normal">t = 4</text><text x="476.7" y="238.0" font-size="11" fill="#6b6b66" text-anchor="middle" font-weight="normal">t = 5</text><text x="560.0" y="238.0" font-size="11" fill="#6b6b66" text-anchor="middle" font-weight="normal">t = 6</text><polyline points="60.0,160.6 143.3,148.8 226.7,134.5 310.0,117.4 393.3,96.9 476.7,72.3 560.0,42.7" fill="none" stroke="#a5342c" stroke-width="2.4"/><circle cx="60.0" cy="160.6" r="3.5" fill="#a5342c"/><circle cx="143.3" cy="148.8" r="3.5" fill="#a5342c"/><circle cx="226.7" cy="134.5" r="3.5" fill="#a5342c"/><circle cx="310.0" cy="117.4" r="3.5" fill="#a5342c"/><circle cx="393.3" cy="96.9" r="3.5" fill="#a5342c"/><circle cx="476.7" cy="72.3" r="3.5" fill="#a5342c"/><circle cx="560.0" cy="42.7" r="3.5" fill="#a5342c"/><text x="556.0" y="32.7" font-size="12" fill="#a5342c" text-anchor="end" font-weight="bold">φ = 1.2: โตขึ้นเรื่อย ๆ ไม่กลับ → ไม่นิ่ง</text><polyline points="60.0,160.6 143.3,160.6 226.7,160.6 310.0,160.6 393.3,160.6 476.7,160.6 560.0,160.6" fill="none" stroke="#6b6b66" stroke-width="2.4"/><circle cx="60.0" cy="160.6" r="3.5" fill="#6b6b66"/><circle cx="143.3" cy="160.6" r="3.5" fill="#6b6b66"/><circle cx="226.7" cy="160.6" r="3.5" fill="#6b6b66"/><circle cx="310.0" cy="160.6" r="3.5" fill="#6b6b66"/><circle cx="393.3" cy="160.6" r="3.5" fill="#6b6b66"/><circle cx="476.7" cy="160.6" r="3.5" fill="#6b6b66"/><circle cx="560.0" cy="160.6" r="3.5" fill="#6b6b66"/><text x="556.0" y="152.6" font-size="12" fill="#6b6b66" text-anchor="end" font-weight="bold">φ = 1: ค้างที่เดิม (random walk ถ้ามี shock จะเดินไปเรื่อย ๆ)</text><polyline points="60.0,160.6 143.3,172.5 226.7,182.0 310.0,189.6 393.3,195.7 476.7,200.5 560.0,204.4" fill="none" stroke="#2f6d3e" stroke-width="2.4"/><circle cx="60.0" cy="160.6" r="3.5" fill="#2f6d3e"/><circle cx="143.3" cy="172.5" r="3.5" fill="#2f6d3e"/><circle cx="226.7" cy="182.0" r="3.5" fill="#2f6d3e"/><circle cx="310.0" cy="189.6" r="3.5" fill="#2f6d3e"/><circle cx="393.3" cy="195.7" r="3.5" fill="#2f6d3e"/><circle cx="476.7" cy="200.5" r="3.5" fill="#2f6d3e"/><circle cx="560.0" cy="204.4" r="3.5" fill="#2f6d3e"/><text x="556.0" y="222.4" font-size="12" fill="#2f6d3e" text-anchor="end" font-weight="bold">φ = 0.8: ค่อย ๆ กลับสู่ค่าเฉลี่ย 0 → นิ่ง</text><text x="300.0" y="260.0" font-size="12" fill="#6b6b66" text-anchor="middle" font-weight="normal">AR(1) Xₜ = φXₜ₋₁ เริ่มที่ X₀ = 1 แล้วไม่มี shock อีกเลย</text></svg>
190" stroke="#1a1a1a"/><rect x="430" y="76.47999999999999" width="44" height="113.52000000000001" rx="4" fill="#c25e00"/><text x="452.0" y="70.5" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="bold">Q = 5.16</text><text x="452.0" y="206.0" font-size="11" fill="#6b6b66" text-anchor="middle" font-weight="normal">H = 2</text><line x1="400" x2="610" y1="105.52000000000001" y2="105.52000000000001" stroke="#a5342c" stroke-dasharray="5 4"/><text x="610.0" y="99.5" font-size="11.5" fill="#a5342c" text-anchor="end" font-weight="bold">χ²(1) ที่ 5% = 3.84</text><text x="320.0" y="238.0" font-size="12" fill="#6b6b66" text-anchor="middle" font-weight="normal">residual ของ MA(1), n = 100: ปฏิเสธ H0 → โมเดลยังไม่เหมาะสม</text></svg>
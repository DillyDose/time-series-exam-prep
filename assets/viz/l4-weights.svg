" rx="3" fill="#c25e00"/><text x="350.0" y="218.0" font-size="11" fill="#6b6b66" text-anchor="middle" font-weight="normal">Xₜ₋₅</text><rect x="404" y="176.4" width="14" height="23.6" rx="3" fill="#c25e00"/><text x="402.0" y="218.0" font-size="11" fill="#6b6b66" text-anchor="middle" font-weight="normal">Xₜ₋₆</text><rect x="456" y="181.1" width="14" height="18.9" rx="3" fill="#c25e00"/><text x="454.0" y="218.0" font-size="11" fill="#6b6b66" text-anchor="middle" font-weight="normal">Xₜ₋₇</text><rect x="508" y="184.9" width="14" height="15.1" rx="3" fill="#c25e00"/><text x="506.0" y="218.0" font-size="11" fill="#6b6b66" text-anchor="middle" font-weight="normal">Xₜ₋₈</text><rect x="560" y="187.9" width="14" height="12.1" rx="3" fill="#c25e00"/><text x="558.0" y="218.0" font-size="11" fill="#6b6b66" text-anchor="middle" font-weight="normal">Xₜ₋₉</text><rect x="612" y="190.3" width="14" height="9.7" rx="3" fill="#c25e00"/><text x="610.0" y="218.0" font-size="11" fill="#6b6b66" text-anchor="middle" font-weight="normal">Xₜ₋₁₀</text><line x1="60" x2="636.0" y1="200" y2="200" stroke="#ddd8cc"/><text x="142.0" y="42.0" font-size="11.5" fill="#1a1a1a" text-anchor="start" font-weight="normal">⅓ เท่ากัน แล้วหายเป็น 0 ทันที</text><text x="99.0" y="104.0" font-size="11.5" fill="#c25e00" text-anchor="middle" font-weight="bold">0.2</text><text x="272.0" y="133.9" font-size="11.5" fill="#c25e00" text-anchor="start" font-weight="normal">0.16, 0.128, 0.102 … ลด 20% ทุกช่วง แต่ไม่เป็น 0</text><rect x="90" y="236" width="14" height="10" rx="2" fill="#6b6b66"/><text x="110.0" y="245.0" font-size="11.5" fill="#1a1a1a" text-anchor="start" font-weight="normal">SMA k = 3</text><rect x="220" y="236" width="14" height="10" rx="2" fill="#c25e00"/><text x="240.0" y="245.0" font-size="11.5" fill="#1a1a1a" text-anchor="start" font-weight="normal">EMA α = 0.2: น้ำหนัก α(1 − α)ʲ รวมกันได้ 1</text></svg>
<svg viewBox="0 0 640 250" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="ACF กับ PACF ที่ lag 2 ของ AR(1)" font-family="-apple-system, Helvetica Neue, Arial, Noto Sans Thai, sans-serif"><defs><marker id="ao" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#c25e00"/></marker><marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1d6fb8"/></marker><marker id="ak" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1a1a1a"/></marker></defs><text x="165.0" y="22.0" font-size="14" fill="#c25e00" text-anchor="middle" font-weight="bold">ACF lag 2 = 0.81</text><text x="165.0" y="40.0" font-size="11.5" fill="#6b6b66" text-anchor="middle" font-weight="normal">นับทางอ้อมผ่าน X(t−1) ด้วย: 0.9 × 0.9</text><rect x="22" y="110" width="76" height="38" rx="8" fill="#fff" stroke="#1a1a1a" stroke-width="1.5"/><text x="60.0" y="135.0" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="bold">X(t−2)</text><rect x="127" y="110" width="76" height="38" rx="8" fill="#fff" stroke="#1a1a1a" stroke-width="1.5"/><text x="165.0" y="135.0" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="bold">X(t−1)</text><rect x="232" y="110" width="76" height="38" rx="8" fill="#fff" stroke="#1a1a1a" stroke-width="1.5"/><text x="270.0" y="135.0" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="bold">Xₜ</text><line x1="100" y1="129" x2="123" y2="129" stroke="#c25e00" stroke-width="2.2" marker-end="url(#ao)"/><text x="112.5" y="104.0" font-size="12" fill="#c25e00" text-anchor="middle" font-weight="bold">× 0.9</text><line x1="205" y1="129" x2="228" y2="129" stroke="#c25e00" stroke-width="2.2" marker-end="url(#ao)"/><text x="217.5" y="104.0" font-size="12" fill="#c25e00" text-anchor="middle" font-weight="bold">× 0.9</text><path d="M 60 152 C 100 205, 230 205, 270 152" fill="none" stroke="#a5342c" stroke-dasharray="5 4" stroke-width="1.6"/><text x="165.0" y="200.0" font-size="11.5" fill="#a5342c" text-anchor="middle" font-weight="bold">ทางตรง: ไม่มีใน AR(1)</text><text x="485.0" y="22.0" font-size="14" fill="#1d6fb8" text-anchor="middle" font-weight="bold">PACF lag 2 = 0</text><text x="485.0" y="40.0" font-size="11.5" fill="#6b6b66" text-anchor="middle" font-weight="normal">ถือ X(t−1) ไว้คงที่ ทางอ้อมถูกตัด เหลือทางตรงซึ่งไม่มี</text><rect x="342" y="110" width="76" height="38" rx="8" fill="#fff" stroke="#1a1a1a" stroke-width="1.5"/><text x="380.0" y="135.0" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="bold">X(t−2)</text><rect x="447" y="110" width="76" height="38" rx="8" fill="#e8e8e4" stroke="#1a1a1a" stroke-width="1.5"/><text x="485.0" y="135.0" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="bold">X(t−1)</text><rect x="552" y="110" width="76" height="38" rx="8" fill="#fff" stroke="#1a1a1a" stroke-width="1.5"/><text x="590.0" y="135.0" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="bold">Xₜ</text><line x1="420" y1="129" x2="443" y2="129" stroke="#bbb" stroke-width="2.2" marker-end=""/><text x="432.5" y="104.0" font-size="12" fill="#bbb" text-anchor="middle" font-weight="bold">× 0.9</text><line x1="525" y1="129" x2="548" y2="129" stroke="#bbb" stroke-width="2.2" marker-end=""/><text x="537.5" y="104.0" font-size="12" fill="#bbb" text-anchor="middle" font-weight="bold">× 0.9</text><path d="M 380 152 C 420 205, 550 205, 590 152" fill="none" stroke="#a5342c" stroke-dasharray="5 4" stroke-width="1.6"/><text x="485.0" y="200.0" font-size="11.5" fill="#a5342c" text-anchor="middle" font-weight="bold">ทางตรง: ไม่มีใน AR(1)</text><text x="485.0" y="172.0" font-size="11.5" fill="#1d6fb8" text-anchor="middle" font-weight="bold">ถือค่าไว้</text><text x="320.0" y="240.0" font-size="12" fill="#6b6b66" text-anchor="middle" font-weight="normal">AR(1) φ = 0.9: X(t−2) ไ